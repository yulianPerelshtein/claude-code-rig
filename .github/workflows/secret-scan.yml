name: secret-scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'      # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo mv /tmp/gitleaks /usr/local/bin/
          gitleaks version
      - name: Run gitleaks
        run: |
          gitleaks detect --source . --redact --verbose --no-banner

  trufflehog:
    name: trufflehog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install trufflehog
        run: |
          curl -sSL -o /tmp/trufflehog.tar.gz \
            https://github.com/trufflesecurity/trufflehog/releases/download/v3.95.6/trufflehog_3.95.6_linux_amd64.tar.gz
          tar -xzf /tmp/trufflehog.tar.gz -C /tmp trufflehog
          sudo mv /tmp/trufflehog /usr/local/bin/
          trufflehog --version
      - name: Run trufflehog
        run: |
          trufflehog filesystem . --no-update --only-verified --fail

  redaction-pattern-blocklist:
    name: redaction-pattern-blocklist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide private marker list
        # The real codenames live in the REDACTION_PATTERNS secret, never in the
        # repo. Write it to the gitignored local path the script prefers.
        #
        # A missing secret used to fall through to the committed template, which
        # carries no real markers: the job then passed green while protecting
        # nothing. That is the same failure that let CI stay green over a real
        # leak. Only a fork, which cannot receive secrets at all, is still
        # allowed to run best-effort.
        env:
          REDACTION_PATTERNS: ${{ secrets.REDACTION_PATTERNS }}
          IS_FORK_PR: >-
            ${{ github.event_name == 'pull_request'
                && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [ -n "$REDACTION_PATTERNS" ]; then
            printf '%s\n' "$REDACTION_PATTERNS" > tools/scripts/redaction-patterns.local.txt
            echo "Loaded private marker list from secret ($(grep -c . tools/scripts/redaction-patterns.local.txt) entries)."
          elif [ "$IS_FORK_PR" = "true" ]; then
            echo "::warning::Fork build - REDACTION_PATTERNS is unavailable by design; marker scan is best-effort."
          else
            echo "::error::REDACTION_PATTERNS is empty or unset on the canonical repo."
            echo "Refusing to scan with the placeholder template: it holds no real"
            echo "markers, so this job would pass while protecting nothing."
            echo "Restore it from the private repo with: tools/sync-markers.sh --yes"
            exit 1
          fi
      - name: Make script executable
        run: chmod +x .github/scripts/check-redactions.sh
      - name: Run blocklist regex
        run: .github/scripts/check-redactions.sh

  policy-summary:
    name: policy-summary
    needs: [gitleaks, trufflehog, redaction-pattern-blocklist]
    runs-on: ubuntu-latest
    steps:
      - run: echo "All three secret-scan gates passed."
